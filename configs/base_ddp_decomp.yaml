# ==============================================================================
# base_ddp_decomp.yaml — Derived base for the DDP iteration-decomposition study
# ==============================================================================
# Identical to base.yaml (all LOCKED values unchanged) EXCEPT output_root, which
# points at an isolated directory so this sub-study does not collide with — or
# get resume-skipped against — the main outputs/all_experiments_summary.csv.
#
# Study: qwen3-4b, DDP only, ws {1(single baseline), 4, 8}, ga=1, 3 reps.
# Goal:  full iteration-time decomposition (fwd/bwd/opt + exposed comm) plus the
#        NCCL all-reduce breakdown from the profiler pass. See matrix_ddp_decomp.
# ==============================================================================

experiment:
  name: null
  output_root: "./outputs_ddp_decomp"   # <-- only change vs base.yaml
  seed: 42

# ---- Locked workload -----------------------------------------------------
workload:
  per_device_batch_size: 2
  seq_len: 2048
  gradient_checkpointing: true          # use_reentrant=False enforced in code
  attn_implementation: "sdpa"

# ---- Locked precision ----------------------------------------------------
precision:
  mode: "bf16"

# ---- Locked optimizer ----------------------------------------------------
optimizer:
  name: "adamw"
  lr: 1.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  max_grad_norm: 1.0
  fused: true

# ---- Measurement protocol (design doc §10) -------------------------------
protocol:
  num_steps: 12
  warmup_steps_discard: 3
  measured_steps: 9
  residual_quality_gate_pct: 5.0

# ---- Distributed ---------------------------------------------------------
distributed:
  backend: "nccl"
  ddp:
    bucket_cap_mb: 25
    gradient_as_bucket_view: true
    find_unused_parameters: false
    broadcast_buffers: false
    static_graph: false
  fsdp:
    forward_prefetch: false
    backward_prefetch: "BACKWARD_PRE"
    limit_all_gathers: true
    use_orig_params: true

# ---- Instrumentation -----------------------------------------------------
instrumentation:
  log_every: 1
  # OFF here too; the orchestrator turns it ON per-run for validated_configs
  # (all 9 cells of this study are listed there), keeping PASS 1 timing clean.
  enable_profiler_trace: false
  enable_tensorboard: true
  profiler:
    skip_first: 3
    wait: 1
    warmup: 1
    active: 5
    repeat: 1
    record_shapes: true
    profile_memory: true
    with_stack: false
    with_flops: true

# ---- Hardware constants ---------------------------------------------------
hardware:
  gpu_mem_gb: 80
  a100_peak_bf16_tflops: 312.0
  measured_nvswitch_bw_gbps: 233.0
  # Reuse the calibrated BW curve from the main run (hardware calibration, not
  # per-study output) so achieved_bw_gbps still resolves.
  nccl_bw_curve_path: "./outputs/nccl_tests/bw_curves.json"

# ---- Runtime env forced by orchestrator ----------------------------------
env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NCCL_DEBUG: "INFO"
  NCCL_DEBUG_SUBSYS: "COLL,INIT"
  TORCH_NCCL_ENABLE_TIMING: "1"
